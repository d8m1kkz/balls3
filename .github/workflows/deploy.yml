name: deploy
on: 
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: test -f Public/index.html
      - run: test -f Public/script.js
      - run: test -f Public/style.css
      - run: sed -i 's/__GITHUB_SHA__/${{ github.sha }}/g' Public/index.html
      - uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ vars.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: 'Public/*'
          remote_path: ${{ vars.SFTP_PATH }}
          sftp_only: true
      - run: curl -fsS ${{ vars.SITE_URL }} | grep -q '<link rel="stylesheet" href="style.css?${{ github.sha }}">'